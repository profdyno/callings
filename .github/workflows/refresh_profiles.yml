name: "5. Refresh Profiles"

# Regenerates the provisioning profile after App ID capability changes
# (e.g. adding iCloud/Push). Does NOT touch the shared distribution cert.

on:
  workflow_dispatch:

jobs:
  refresh:
    name: Force-regenerate profile
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          gem install bundler:2.5.22
          bundle _2.5.22_ install

      - name: Regenerate profile
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: bundle exec fastlane force_profiles
