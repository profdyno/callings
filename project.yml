name: Callings
options:
  bundleIdPrefix: com.callings
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Callings:
    type: application
    platform: iOS
    sources:
      - path: Callings
    info:
      path: Callings/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CKSharingSupported: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.profdyno.callings.member
            UTTypeDescription: Ward Member
            UTTypeConformsTo:
              - public.data
    entitlements:
      path: Callings/Callings.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.profdyno.callings
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).callings.Callings
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: NO
        GENERATE_INFOPLIST_FILE: NO

  CallingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallingsTests
    dependencies:
      - target: Callings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Callings:
    build:
      targets:
        Callings: all
        CallingsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CallingsTests
    archive:
      config: Release
